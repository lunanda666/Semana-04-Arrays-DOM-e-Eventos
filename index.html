
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semana 04 - JavaScript</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0edff;
            color: #292044;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        section {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
        }

        button {
            background: #6046a8;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        input {
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 6px;
            margin: 5px 0;
        }

        .destaque {
            color: #6046a8;
            font-weight: bold;
        }

        .feito {
            text-decoration: line-through;
            color: #777;
        }

        li {
            margin: 8px 0;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <h1 id="titulo">Meu blog</h1>
        <p class="texto">Aprendendo JavaScript na prática.</p>
        <p class="texto">Semana 04: Arrays, DOM e Eventos.</p>
    </header>

    <main>
        <section>
            <h2>Lista de itens e tarefas</h2>

            <!-- Três itens iniciais para testar Event Delegation -->
            <ul id="lista">
                <li>Primeiro item do HTML</li>
                <li>Segundo item do HTML</li>
                <li>Terceiro item do HTML</li>
            </ul>

            <form id="formulario">
                <label for="tarefa">Nova tarefa:</label>
                <input
                    type="text"
                    id="tarefa"
                    placeholder="Digite uma tarefa"
                >
                <button type="submit">Adicionar tarefa</button>
            </form>
        </section>

        <section>
            <h2>Eventos</h2>

            <button type="button" id="botao">Clique aqui</button>

            <div>
                <label for="nome">Digite seu nome:</label>
                <input
                    type="text"
                    id="nome"
                    placeholder="Seu nome"
                >
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
